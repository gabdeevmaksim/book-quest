services:
  quest-book:
    build: .
    # No public ports: only Caddy (below) talks to the app, inside the compose network.
    # For a local run without Caddy, use:  docker-compose run --service-ports … or add
    # "8501:8501" back here temporarily.
    expose:
      - "8501"
    volumes:
      - .:/app
    env_file:
      - .env
    restart: always

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificates — keep across deploys
      - caddy_config:/config
    env_file:
      - .env
    depends_on:
      - quest-book
    restart: always

volumes:
  caddy_data:
  caddy_config:
